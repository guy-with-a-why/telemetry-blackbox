# One ClickHouse server on data-1, on the local volume in volume.yaml. It
# shares data-1's 4 GB and 40 GB disk with Redpanda, so most of this file is
# about staying inside that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: blackbox
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: telemetry-blackbox
data:
  blackbox.xml: |
    <clickhouse>
      <!-- Logs go to stdout, where the kubelet rotates them. The image's
           default writes them to files on the node's disk with no cap. -->
      <logger>
        <level>information</level>
        <console>1</console>
        <log remove="1"/>
        <errorlog remove="1"/>
      </logger>

      <!-- Only HTTP and the native protocol, the two the Service exposes.
           The interserver port is for replicas, and there's one server. -->
      <mysql_port remove="1"/>
      <postgresql_port remove="1"/>
      <interserver_http_port remove="1"/>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: blackbox
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: telemetry-blackbox
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: blackbox
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: telemetry-blackbox
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: telemetry-blackbox
    spec:
      # Time to finish merges and flush on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # 26.3 is the last LTS that runs on x86-64-v2. From 26.6 the image
          # needs AVX2, which my home server's 2012 CPU doesn't have, and the
          # VMs see the host's CPU as it is. 26.3 is supported until March
          # 2027, and real hardware would take 26.8.
          image: docker.io/clickhouse/clickhouse-server:26.3.66.4@sha256:e0504b765b22caa05d6f12a81f05c79c75e80936b57ed2235dc75a0f36d0805e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # With a password, the image's entrypoint opens the default
            # user to the network. Without one, it only answers localhost.
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse
                  key: password
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.d/blackbox.xml
              subPath: blackbox.xml
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
