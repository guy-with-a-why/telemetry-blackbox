# kube-vip holds the API's virtual IP on one control plane and answers ARP
# for it. If that node goes down, another wins the lease and takes the IP.
# Generated by kube-vip v1.3.1 with `kube-vip manifest pod --controlplane
# --arp --leaderElection`, then reordered and commented.
# scripts/cluster-files.sh fills in @VIP@, @INTERFACE@, @IMAGE@ and @LEASE@.
#
# It runs as a static Pod, so the kubelet starts it from
# /etc/kubernetes/manifests before the API exists. It reads admin.conf to
# take its lease, but admin.conf has no rights until kubeadm init finishes.
# So on cp-1 only, I point the hostPath below at super-admin.conf before init
# and back to admin.conf after it.
apiVersion: v1
kind: Pod
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  containers:
    - name: kube-vip
      image: @IMAGE@
      imagePullPolicy: IfNotPresent
      args: [manager]
      env:
        - name: address
          value: "@VIP@"
        - name: port
          value: "6443"
        - name: vip_interface
          value: "@INTERFACE@"
        - name: vip_subnet
          value: "32"
        - name: vip_arp
          value: "true"
        - name: cp_enable
          value: "true"
        - name: cp_namespace
          value: kube-system
        - name: vip_nodename
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: vip_leaderelection
          value: "true"
        - name: vip_leasename
          value: "@LEASE@"
        - name: vip_leaseduration
          value: "15"
        - name: vip_renewdeadline
          value: "10"
        - name: vip_retryperiod
          value: "2"
        - name: prometheus_server
          value: :2112
      securityContext:
        capabilities:
          add: [NET_ADMIN, NET_RAW]
          drop: [ALL]
      volumeMounts:
        - name: kubeconfig
          mountPath: /etc/kubernetes/admin.conf
  # kube-vip reaches the API server on its own node as kubernetes:6443, since
  # the VIP isn't up until kube-vip brings it up.
  hostAliases:
    - hostnames: [kubernetes]
      ip: 127.0.0.1
  hostNetwork: true
  volumes:
    - name: kubeconfig
      hostPath:
        path: /etc/kubernetes/admin.conf
