#cloud-config
# Every node, control plane or worker, starts from this file, so they all
# reach kubeadm in the same state. scripts/vms.sh passes it to Multipass. It
# fills in @KUBERNETES_MINOR@ from deploy/vms/config.sh, and @REGISTRY@,
# @K8S_MIRROR@ and @APT_CACHE@ with what scripts/host.sh runs on the bridge.

# apt goes through the cache on the host, so each package crosses the internet
# once. The real host goes first in the path, which is how the cache routes it.
apt:
  primary:
    - arches: [default]
      uri: http://@APT_CACHE@/archive.ubuntu.com/ubuntu
  security:
    - arches: [default]
      uri: http://@APT_CACHE@/security.ubuntu.com/ubuntu

packages:
  - containerd
  - curl
  - gpg
package_update: true

write_files:
  # Pod traffic crosses nodes, so the kernel must forward packets, and traffic
  # on Linux bridges must pass through iptables, where Services are routed.
  # br_netfilter provides the bridge sysctls, and kubeadm's preflight checks
  # them all.
  - path: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/90-kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  - path: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
  # Images are pushed to localhost:5000 on the host, so a pod pulls the same
  # name. containerd sends those pulls to the host over plain HTTP.
  - path: /etc/containerd/certs.d/localhost:5000/hosts.toml
    content: |
      server = "http://@REGISTRY@"

      [host."http://@REGISTRY@"]
        capabilities = ["pull", "resolve"]
  # The control-plane images come through a mirror on the host, or straight
  # from registry.k8s.io if the mirror is down.
  - path: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    content: |
      server = "https://registry.k8s.io"

      [host."http://@K8S_MIRROR@"]
        capabilities = ["pull", "resolve"]
  - path: /usr/local/sbin/prepare-node
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Load the modules, install kubeadm one minor version behind the latest
      # and point containerd at systemd's cgroups and the local registry.
      set -euo pipefail
      minor=@KUBERNETES_MINOR@

      modprobe overlay
      modprobe br_netfilter
      sysctl --system >/dev/null
      swapoff -a

      # From the Kubernetes install guide:
      # https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/#install-using-native-package-management
      # Packages come through the cache. The key comes straight from upstream,
      # so the cache can't swap it, and apt checks every package against it.
      key="https://pkgs.k8s.io/core:/stable:/$minor/deb/Release.key"
      repo="http://@APT_CACHE@/pkgs.k8s.io/core:/stable:/$minor/deb/"
      curl -fsSL "$key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] $repo /" >/etc/apt/sources.list.d/kubernetes.list
      apt-get update -q
      # kubeadm no longer pulls in cri-tools, and crictl is how I debug a node.
      apt-get install -yq kubelet kubeadm kubectl cri-tools
      apt-mark hold kubelet kubeadm kubectl

      # The sandbox image must match the one kubeadm expects, or kubeadm warns.
      pause=$(kubeadm config images list --kubernetes-version "$(kubeadm version -o short)" | grep /pause:)
      mkdir -p /etc/containerd
      containerd config default >/etc/containerd/config.toml
      # Match kubelet's systemd cgroup driver and kubeadm's pause image, and
      # fail loudly if containerd renames a key. containerd 2 pulls through its
      # transfer service by default, which ignores certs.d. The local pull path
      # reads it.
      sed -i -E \
        -e 's/SystemdCgroup = false/SystemdCgroup = true/' \
        -e "s#^(\s*sandbox(_image)? = ).*#\1\"$pause\"#" \
        -e 's/use_local_image_pull = false/use_local_image_pull = true/' \
        /etc/containerd/config.toml
      grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
      grep -q 'use_local_image_pull = true' /etc/containerd/config.toml
      grep -q "config_path = .*/etc/containerd/certs.d" /etc/containerd/config.toml
      systemctl restart containerd
      systemctl enable kubelet

runcmd:
  - /usr/local/sbin/prepare-node
