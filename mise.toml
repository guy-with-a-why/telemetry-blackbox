# Bench tools, pinned. `mise install` sets up a fresh machine, and CI uses
# the same versions.
# Rust is pinned in rust-toolchain.toml. Multipass (snap), Renode, probe-rs
# and the ClickHouse client are installed by hand; `just bench` checks them.
[tools]
just = "1.59.0"
d2 = "0.9.0"
uv = "0.13.7"
kubectl = "1.37.2"
helm = "4.3.1"
mdbook = "0.5.4"
gitleaks = "8.30.1"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
