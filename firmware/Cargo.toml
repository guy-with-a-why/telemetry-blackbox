# Its own workspace, because it only builds for the microcontroller.
[workspace]

[package]
name = "firmware"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# TIM2 drives embassy-time, so the other timers stay free for the control loop.
embassy-stm32 = { version = "0.6.0", features = ["stm32f407vg", "rt", "time-driver-tim2"] }
embassy-time = "0.5.1"
panic-halt = "1.0.0"

[profile.release]
# Symbols cost nothing in flash, and Renode and objdump both use them.
debug = 2
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
