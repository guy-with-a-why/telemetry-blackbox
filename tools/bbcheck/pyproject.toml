[project]
name = "bbcheck"
version = "0.2.0"
description = "Proves what reached ClickHouse: gaps, duplicates and latency."
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = []

[project.scripts]
bbcheck = "bbcheck:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
