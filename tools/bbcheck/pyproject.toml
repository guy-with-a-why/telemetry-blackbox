[project]
name = "bbcheck"
version = "0.1.0"
description = "Proves what reached ClickHouse: gaps, duplicates and latency."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bbcheck = "bbcheck:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
