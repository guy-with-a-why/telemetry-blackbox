name: pull request

# A pull request is squash-merged with its title as the commit message, and
# release-please reads that message to pick the next version.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|test|refactor|ci|build|perf|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::The title must read 'type(scope): summary', for example 'feat(gateway): resync after a bad CRC'."
            exit 1
          fi

  description:
    name: description
    runs-on: ubuntu-latest
    # release-please and Dependabot write their own descriptions
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/')
    steps:
      - name: Check the description follows the template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=0
          for heading in '## Why' '## How it was tested'; do
            if ! grep -qxF "$heading" <<<"${BODY//$'\r'/}"; then
              echo "::error::The description needs a '$heading' section."
              failed=1
            fi
          done
          # the description becomes the squash commit's body on main
          if [[ "$BODY" == *'<!--'* ]]; then
            echo "::error::Delete the template's comments. The description becomes the commit message."
            failed=1
          fi
          exit "$failed"
