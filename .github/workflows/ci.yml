name: ci

on:
  push:
    branches: [main] # other branches get CI through their pull request
  pull_request:
  issues:
    types: [opened, edited, closed, reopened, deleted, milestoned, demilestoned]
  schedule:
    - cron: "0 6 * * *" # keeps the flight strip's waypoint ETAs current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # A pull request runs only the jobs its files can affect. A skipped job still
  # reports, so the required checks pass. Every other event runs everything.
  # Higher up a stack, the lint and tests wait until the pull request reaches
  # the bottom and targets main.
  changes:
    name: find what changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.rust == 'true' && github.base_ref == 'main') }}
      python: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.python == 'true' && github.base_ref == 'main') }}
      shell: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.shell == 'true' && github.base_ref == 'main') }}
      scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - justfile
              - mise.toml
            rust:
              - *ci
              - "**/*.rs"
              - "**/Cargo.toml"
              - "**/Cargo.lock"
              - rust-toolchain.toml
              - firmware/**
            python:
              - *ci
              - tools/bbcheck/**
              - ruff.toml
            shell:
              - *ci
              - scripts/*.sh
              - deploy/**/*.sh
            scripts:
              - *ci
              - scripts/**
              - tools/flight/**

  audit:
    name: scan for secrets
    if: github.event_name != 'issues' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: just gitleaks
      - run: just audit

  lint:
    name: format and lint the code
    needs: changes
    if: >-
      github.event_name != 'issues' && github.event_name != 'schedule' &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.shell == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: just uv shellcheck shfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            firmware
      - run: just lint

  test:
    name: test and measure coverage
    needs: changes
    if: >-
      github.event_name != 'issues' && github.event_name != 'schedule' &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: just uv github:taiki-e/cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            firmware
      - run: just test
      - run: just coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage/coverage.json
          if-no-files-found: error

  docs:
    name: build the docs site
    needs: [changes, test]
    # issue edits, the nightly run and pull requests that skip the tests reuse
    # the live badge
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.test.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      # a skipped check passes, so if the filter breaks this required check fails
      - name: Check the filter ran
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Couldn't tell what changed, so the skipped checks prove nothing."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: just mdbook node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.test.result == 'success'
        with:
          name: coverage
          path: target/coverage
      - name: Reuse the published coverage badge
        if: needs.test.result == 'skipped'
        run: |
          mkdir -p target/coverage
          if curl -fsSL https://guy-with-a-why.github.io/telemetry-blackbox/coverage.json -o "$RUNNER_TEMP/coverage.json"; then
            mv "$RUNNER_TEMP/coverage.json" target/coverage/coverage.json
          else
            echo "::warning::There's no published coverage badge to reuse."
          fi
      - run: just docs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: book

  scripts:
    name: lint and test the scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: just uv node
      - run: just test-scripts

  deploy:
    name: publish the docs site
    needs: [audit, docs]
    # docs can run after a skipped job, so check the results explicitly
    if: >-
      !cancelled() && needs.audit.result == 'success' && needs.docs.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
