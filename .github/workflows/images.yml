name: images

# Scans the third-party images the cluster runs, every Monday and whenever a
# change touches deploy/. It only reports: their advisories are mostly in base
# packages only the publisher can fix, so the action is to move the digest once
# they ship one (ADR 7). The table lands in the run's summary and the full
# results in an artifact.
on:
  pull_request:
    paths: ["deploy/**", "scripts/image-scan.sh", ".github/workflows/images.yml"]
  schedule:
    - cron: "0 8 * * 1" # Mondays, after the lockfile scan
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan the third-party images
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the manifests in deploy/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: osv-scanner yq
      # Every image pinned by digest: each image field in the manifests, read
      # with yq, and kube-vip's, which config.sh pins for cluster-files.sh
      - name: Scan the images
        run: |
          # shellcheck source=/dev/null # plain assignments, checked where the scripts source it
          source deploy/vms/config.sh
          mapfile -t images < <(
            {
              find deploy -name '*.yaml' -exec yq -N '.. | select(tag == "!!map" and has("image")) | .image | select(test("@sha256:"))' {} +
              echo "$kube_vip_image"
            } | sort -u
          )
          { echo "### Third-party images"; echo; scripts/image-scan.sh --out "$RUNNER_TEMP/scan" "${images[@]}"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: image-scan
          path: ${{ runner.temp }}/scan
          retention-days: 30
