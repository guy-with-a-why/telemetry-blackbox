name: release

# release-please keeps a release pull request open from the commits on main.
# Merging it tags the release, and the jobs below publish what it ships.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild the firmware for this release and attach it with its provenance, e.g. v0.2.0
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN starts no workflows, so the
      # release pull request would never get its required checks.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}

  image:
    name: image (${{ matrix.crate }}, ${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        crate: [gateway, pipeline]
        arch: [amd64, arm64]
    # each architecture builds natively, which is far faster than emulation
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # pushed by digest only; the manifest job tags the multi-arch image
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: CRATE=${{ matrix.crate }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.crate }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.crate }}-${{ matrix.arch }}
      - name: Keep the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p "$RUNNER_TEMP/digests" && touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.crate }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: multi-arch image (${{ matrix.crate }})
    needs: [release-please, image]
    strategy:
      matrix:
        crate: [gateway, pipeline]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.crate }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.crate }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The ELF ships with SLSA provenance. The .intoto.jsonl file is the signed
  # in-toto statement and the .sigstore.json file is the whole bundle, so
  # either `gh attestation verify` or cosign can check it.
  firmware:
    name: attach the firmware
    needs: release-please
    if: >-
      needs.release-please.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # sign the provenance
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a release tag like v1.2.3."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # the firmware is a library until Day 1 gives it a binary
      - id: binary
        run: |
          if [[ -f firmware/src/main.rs ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::There's no firmware binary yet, so nothing is attached."; fi
      - if: steps.binary.outputs.exists == 'true'
        working-directory: firmware
        run: |
          cargo build --release --locked
          cp target/thumbv7em-none-eabihf/release/firmware "../firmware-$TAG.elf"
      - id: attest
        if: steps.binary.outputs.exists == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: firmware-${{ env.TAG }}.elf
      - if: steps.binary.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # Attach the ELF and two copies of its provenance:
        #   .sigstore.json  the whole Sigstore bundle, with the certificate
        #                   that gh attestation verify and cosign check
        #   .intoto.jsonl   only the signed in-toto statement (a DSSE
        #                   envelope), the file Scorecard looks for
        # Format: https://github.com/in-toto/attestation/blob/main/spec/v1/bundle.md
        # A hand run for an older tag replaces its files, hence --clobber and
        # the check against the published ELF.
        run: |
          elf="firmware-$TAG.elf"
          cp "$BUNDLE" "$elf.sigstore.json"
          jq -c .dsseEnvelope "$BUNDLE" > "$elf.intoto.jsonl"
          if gh release download "$TAG" --pattern "$elf" --output published.elf 2>/dev/null; then
            if cmp -s published.elf "$elf"; then echo "::notice::$elf matches the published binary."
            else echo "::warning::$elf differs from the published binary it replaces."; fi
          fi
          gh release upload "$TAG" "$elf" "$elf.intoto.jsonl" "$elf.sigstore.json" --clobber
